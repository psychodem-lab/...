<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDF0EB">
<title>Znajdź słowa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
:root{
  --bg:#EDF0EB; --surface:#F9FAF7; --ink:#2B3733; --muted:#71807A;
  --line:#D9DFD8; --accent:#4F8A73; --on-accent:#fff; --soft:#E7EEE7; --sel:#B7D5C4;
  --chip:#DCEBE2; --chip-ink:#2F6350; --err:#B5503F; --ok:#3B7862;
  --shadow:0 10px 30px -12px rgba(43,55,51,.35);
  --w:min(calc(100vw - 40px), 340px, 44dvh);
}
:root[data-theme="dark"]{
  --bg:#131A18; --surface:#1B2421; --ink:#E4EBE6; --muted:#8C9A93;
  --line:#2A3631; --accent:#7CBFA3; --on-accent:#10201A; --soft:#212D29; --sel:#3B5A4C;
  --chip:#2A4136; --chip-ink:#BFE3D2; --err:#EE9686; --ok:#8FD1B4;
  --shadow:0 10px 30px -12px rgba(0,0,0,.7);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;height:100dvh;overflow:hidden;color:var(--ink);background:var(--bg);
  font-family:"Nunito",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  touch-action:none;user-select:none;-webkit-user-select:none;transition:background .4s,color .4s}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{width:min(100vw,480px);height:100%;margin:0 auto;display:flex;flex-direction:column;gap:12px;align-items:center;
  padding:max(12px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom))}
header{width:100%;display:flex;align-items:center;justify-content:space-between}
h1{margin:0;font-size:1.6rem;font-weight:800}
.round{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--muted);transition:background .2s,transform .12s}
.round:hover{background:var(--soft)} .round:active{transform:scale(.9)}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#ico-sun{display:none}[data-theme="dark"] #ico-sun{display:block}[data-theme="dark"] #ico-moon{display:none}

.progress{width:100%;display:flex;align-items:center;gap:12px;font-weight:700;font-size:.9rem;color:var(--muted)}
.bar{flex:1;height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.3,1)}

.found{width:100%;flex:1 1 0;min-height:84px;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);
  padding:12px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px;overflow-y:auto;position:relative;
  touch-action:pan-y;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.empty{position:absolute;inset:0;display:grid;place-items:center;padding:16px;text-align:center;color:var(--muted);font-weight:600;line-height:1.4;pointer-events:none}
.chip{background:var(--chip);color:var(--chip-ink);padding:7px 14px;border-radius:99px;font-size:.95rem;font-weight:700;
  letter-spacing:.04em;animation:pop .3s ease-out;transition:transform .12s}
.chip:active{transform:scale(.94)}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}

.pill{height:52px;min-width:120px;max-width:100%;padding:0 26px;border-radius:99px;background:var(--surface);box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:800;letter-spacing:.14em;
  transition:background .25s,color .25s,opacity .25s;opacity:.55}
.pill:not(:empty){opacity:1}
.pill.ok{background:var(--accent);color:var(--on-accent)}
.pill.bad{color:var(--err);animation:shake .3s}
.pill.dup{color:var(--muted)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#message{height:22px;margin-top:-4px;font-weight:700;font-size:.9rem;color:var(--muted);text-align:center}

.wheel{position:relative;width:var(--w);height:var(--w);flex:none;border-radius:50%;background:var(--soft);box-shadow:inset 0 2px 12px rgba(43,55,51,.08)}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.letter{position:absolute;width:19%;height:19%;transform:translate(-50%,-50%);border-radius:50%;background:var(--surface);color:var(--ink);
  display:grid;place-items:center;font-size:calc(var(--w) * .085);font-weight:800;cursor:pointer;z-index:10;
  box-shadow:0 4px 10px -4px rgba(43,55,51,.45);transition:background .15s,color .15s,transform .12s}
.letter.active{background:var(--accent);color:var(--on-accent);transform:translate(-50%,-50%) scale(1.1)}
.shuffle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:16%;height:16%;border-radius:50%;background:var(--surface);
  color:var(--muted);display:grid;place-items:center;z-index:20;box-shadow:0 4px 10px -4px rgba(43,55,51,.45);transition:transform .2s}
.shuffle:active{transform:translate(-50%,-50%) scale(.9)}
.shuffle svg{transition:transform .4s}.shuffle:active svg{transform:rotate(180deg)}

.btn{padding:13px 26px;border-radius:99px;font-weight:800;font-size:1rem;background:var(--accent);color:var(--on-accent);
  box-shadow:0 6px 16px -8px rgba(43,55,51,.6);transition:transform .12s}
.btn:active{transform:scale(.95)}
.btn.ghost{background:var(--soft);color:var(--ink);box-shadow:none}

.overlay{position:fixed;inset:0;z-index:1000;display:none;place-items:center;background:rgba(19,26,24,.55);backdrop-filter:blur(4px);padding:24px}
.overlay.open{display:grid}
.modal{background:var(--surface);border-radius:26px;padding:30px 26px;text-align:center;max-width:340px;box-shadow:var(--shadow);animation:pop .4s ease-out}
.modal h2{margin:0 0 8px;font-size:1.7rem;font-weight:800}
.modal p{margin:0 0 22px;color:var(--muted);font-weight:600;line-height:1.45}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>Znajdź słowa</h1>
    <button class="round" onclick="toggleTheme()" aria-label="Zmień motyw">
      <svg id="ico-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z"/></svg>
      <svg id="ico-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <div class="progress"><div class="bar"><i id="bar"></i></div><span id="stats">0 / 0</span></div>

  <div class="found" id="found">
    <div class="empty" id="empty">Połącz litery palcem.<br>Znalezione słowa pojawią się tutaj.</div>
  </div>

  <div class="pill" id="pill" aria-live="polite"></div>
  <div id="message"></div>

  <div class="wheel" id="wheel">
    <canvas id="canvas"></canvas>
    <button class="shuffle" onclick="shuffleCurrentLetters()" aria-label="Pomieszaj litery">
      <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
    </button>
  </div>

  <button class="btn ghost" onclick="loadRandomLevel()">Zmień zestaw liter</button>
</main>

<div id="victory-modal" class="overlay">
  <div class="modal">
    <h2>Brawo! 🌿</h2>
    <p>Wszystkie słowa z tego zestawu są znalezione.</p>
    <button class="btn" onclick="closeModalAndNext()">Kolejny poziom</button>
  </div>
</div>

<script src="poziomy.js"></script>
<script>
let currentLevel = null, guessedWords = [], currentWord = "", currentLevelIndex = -1;
let isDragging = false, selectedNodes = [], pointer = {x: 0, y: 0}, pillTimer, msgTimer, dpr = 1;
const $ = id => document.getElementById(id);
const found = $('found'), empty = $('empty'), pill = $('pill'), wheel = $('wheel'),
      message = $('message'), canvas = $('canvas'), ctx = canvas.getContext('2d');

function toggleTheme() {
  const r = document.documentElement, dark = r.dataset.theme !== 'dark';
  if (dark) r.dataset.theme = 'dark'; else delete r.dataset.theme;
  document.querySelector('meta[name=theme-color]').content = dark ? '#131A18' : '#EDF0EB';
}
if (matchMedia('(prefers-color-scheme: dark)').matches) toggleTheme();

function say(text, ms = 1400) {
  message.textContent = text;
  clearTimeout(msgTimer);
  if (text) msgTimer = setTimeout(() => message.textContent = "", ms);
}

function sizeCanvas() {
  const r = canvas.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  canvas.width = r.width * dpr; canvas.height = r.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function clearCanvas() { ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr); }
window.addEventListener('resize', () => { sizeCanvas(); drawLines(); });

function loadRandomLevel() {
  let i = currentLevelIndex;
  if (gameLevels.length > 1) while (i === currentLevelIndex) i = Math.floor(Math.random() * gameLevels.length);
  else i = 0;
  currentLevelIndex = i;
  currentLevel = gameLevels[i];
  guessedWords = []; currentWord = ""; selectedNodes = [];
  clearTimeout(pillTimer);
  pill.textContent = ""; pill.className = "pill"; say("");
  found.querySelectorAll('.chip').forEach(c => c.remove());
  empty.style.display = '';
  initWheel();
  updateStats();
}

function initWheel() {
  wheel.querySelectorAll('.letter').forEach(l => l.remove());
  sizeCanvas(); clearCanvas();
  const letters = [...currentLevel.letters].sort(() => Math.random() - 0.5);
  letters.forEach((ch, i) => {
    const a = (i / letters.length) * 2 * Math.PI - Math.PI / 2;
    const el = document.createElement('div');
    el.className = 'letter';
    el.textContent = ch;
    el.style.left = (50 + 34 * Math.cos(a)) + '%';
    el.style.top = (50 + 34 * Math.sin(a)) + '%';
    wheel.appendChild(el);
  });
}

function shuffleCurrentLetters() {
  if (!currentLevel || isDragging) return;
  initWheel();
  say("Pomieszano!", 900);
}

const clientPos = e => (e.touches && e.touches.length) ? {x: e.touches[0].clientX, y: e.touches[0].clientY} : {x: e.clientX, y: e.clientY};

function center(node) {
  const r = node.getBoundingClientRect(), c = canvas.getBoundingClientRect();
  return {x: r.left + r.width / 2 - c.left, y: r.top + r.height / 2 - c.top};
}

function drawLines() {
  clearCanvas();
  if (!selectedNodes.length) return;
  const c = canvas.getBoundingClientRect();
  ctx.lineWidth = c.width * 0.05;
  ctx.lineCap = ctx.lineJoin = 'round';
  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
  ctx.globalAlpha = .55;
  ctx.beginPath();
  selectedNodes.forEach((n, i) => { const p = center(n); i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); });
  if (isDragging) ctx.lineTo(pointer.x - c.left, pointer.y - c.top);
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function showWord() { pill.className = "pill"; pill.textContent = currentWord; }

function startDrag(e) {
  const pos = clientPos(e), t = document.elementFromPoint(pos.x, pos.y);
  if (t && t.classList.contains('letter')) {
    clearTimeout(pillTimer);
    isDragging = true; pointer = pos;
    selectedNodes = [t]; currentWord = t.textContent;
    t.classList.add('active');
    showWord(); say("");
    drawLines();
  }
}

function moveDrag(e) {
  if (!isDragging) return;
  e.preventDefault();
  pointer = clientPos(e);
  const t = document.elementFromPoint(pointer.x, pointer.y);
  if (t && t.classList.contains('letter')) {
    if (!selectedNodes.includes(t)) {
      selectedNodes.push(t); currentWord += t.textContent;
      t.classList.add('active'); showWord();
    } else if (selectedNodes.length > 1 && t === selectedNodes[selectedNodes.length - 2]) {
      selectedNodes.pop().classList.remove('active');
      currentWord = currentWord.slice(0, -1); showWord();
    }
  }
  drawLines();
}

function stopDrag() {
  if (!isDragging) return;
  isDragging = false;
  selectedNodes.forEach(n => n.classList.remove('active'));
  selectedNodes = [];
  clearCanvas();
  const word = currentWord;
  currentWord = "";
  checkWord(word);
}

function feedback(cls) {
  pill.className = "pill " + cls;
  clearTimeout(pillTimer);
  pillTimer = setTimeout(() => { pill.textContent = ""; pill.className = "pill"; }, 800);
}

function checkWord(word) {
  if (word.length < 2) { pill.textContent = ""; return; }
  pill.textContent = word;
  if (guessedWords.includes(word)) {
    feedback("dup"); say("To słowo już masz.");
  } else if (currentLevel.words.includes(word)) {
    guessedWords.push(word);
    addChip(word); updateStats();
    feedback("ok"); say("Świetnie!");
    if (guessedWords.length === currentLevel.words.length) setTimeout(triggerVictory, 500);
  } else {
    feedback("bad"); say("Tego słowa nie ma w słowniku.");
  }
}

function addChip(word) {
  empty.style.display = 'none';
  const chip = document.createElement('button');
  chip.className = 'chip';
  chip.textContent = word;
  chip.title = "Sprawdź znaczenie w sjp.pl";
  chip.onclick = () => window.open(`https://sjp.pl/${encodeURIComponent(word)}`, '_blank');
  found.appendChild(chip);
  Array.from(found.querySelectorAll('.chip'))
    .sort((a, b) => a.textContent.localeCompare(b.textContent, 'pl'))
    .forEach(c => found.appendChild(c));
  chip.scrollIntoView({block: 'nearest'});
}

function updateStats() {
  const n = guessedWords.length, t = currentLevel.words.length;
  $('stats').textContent = `${n} / ${t}`;
  $('bar').style.width = (t ? n / t * 100 : 0) + '%';
}

function triggerVictory() {
  try { new Audio('https://actions.google.com/sounds/v1/crowds/crowd_cheer.ogg').play().catch(() => {}); } catch (e) {}
  if (window.confetti && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const end = Date.now() + 2500, base = {startVelocity: 28, spread: 360, ticks: 60, zIndex: 10000, colors: ['#4F8A73', '#B7D5C4', '#C99A3B', '#E7EEE7', '#7CBFA3']};
    const rnd = (a, b) => Math.random() * (b - a) + a;
    const iv = setInterval(() => {
      const left = end - Date.now();
      if (left <= 0) return clearInterval(iv);
      const n = 40 * (left / 2500);
      confetti({...base, particleCount: n, origin: {x: rnd(.1, .3), y: Math.random() - .2}});
      confetti({...base, particleCount: n, origin: {x: rnd(.7, .9), y: Math.random() - .2}});
    }, 250);
  }
  $('victory-modal').classList.add('open');
}

function closeModalAndNext() {
  $('victory-modal').classList.remove('open');
  loadRandomLevel();
}

window.addEventListener('mousedown', startDrag, {passive: false});
window.addEventListener('mousemove', moveDrag, {passive: false});
window.addEventListener('mouseup', stopDrag);
window.addEventListener('touchstart', startDrag, {passive: false});
window.addEventListener('touchmove', moveDrag, {passive: false});
window.addEventListener('touchend', stopDrag);
window.addEventListener('touchcancel', stopDrag);

loadRandomLevel();
</script>
</body>
</html>
